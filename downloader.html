<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>钉钉回放下载器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1 data-i18n="appTitle">钉钉回放下载器</h1>
        <p data-i18n="appSubtitle">本地学习版，仅用于你已有权限访问的回放。</p>
      </div>
      <div class="header-actions">
        <label class="language-field">
          <span data-i18n="language">语言</span>
          <select id="languageSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <button id="openTabBtn" class="ghost" type="button" data-i18n="openTab">打开标签页</button>
      </div>
    </header>

    <section class="panel">
      <label class="field">
        <span data-i18n="replayLink">回放链接</span>
        <textarea id="replayUrl" rows="5" spellcheck="false" data-i18n-placeholder="replayPlaceholder" placeholder="粘贴钉钉回放链接，或 roomId=...&liveUuid=..."></textarea>
      </label>

      <div class="controls">
        <label class="field compact">
          <span data-i18n="output">输出格式</span>
          <select id="outputFormat">
            <option value="mp4" data-i18n="mp4Option">MP4 via mux.js</option>
            <option value="ts" data-i18n="tsOption">合并 TS</option>
          </select>
        </label>
        <label class="field compact">
          <span data-i18n="concurrency">并发数</span>
          <input id="concurrency" type="number" min="1" max="12" value="4">
        </label>
      </div>

      <div class="actions">
        <button id="startBtn" type="button" data-i18n="download">下载</button>
        <button id="cancelBtn" class="ghost danger" type="button" disabled data-i18n="cancel">取消</button>
      </div>
    </section>

    <section class="status-panel" aria-live="polite">
      <div class="status-row">
        <span id="statusText">就绪</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="vendor/mux.min.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
