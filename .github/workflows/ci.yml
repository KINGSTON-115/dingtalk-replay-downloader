name: CI

on:
  push:
    branches: [main, dev, "feat/**", "fix/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Build release package
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run package

      - name: Upload release package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: web-video-downloader-package
          path: dist/*.zip
          if-no-files-found: error
